# A0 Architecture dependency-edge rules
# Each rule defines constraints on imports between packages.
# Rule types:
#   stdlib-only:    package must have zero non-stdlib transitive deps
#   forbidden-target: package(s) must not depend on target package(s) or zone(s)
#   allowed-only:    package(s) may only depend on specific named packages
#   file-guard:     specific source file must not import certain packages

# Package zones for grouping rules
zones:
  pure-core:
    - internal/domain
    - internal/accesslease
    - internal/localkey
  host-reachability:
    - internal/node
    - internal/reachability
    - internal/reachability/bundle
  secure-connectivity:
    - internal/engine
    - internal/openauth
  coordination-security:
    - internal/exactauthority
  application-usecase:
    - internal/usecase
  outer-adapter-composition:
    - internal/runtime
    - internal/store
    - internal/cli
    - internal/discovery
    - internal/authority
    - internal/protocol

rules:
  # R1: pure-core packages must be stdlib-only
  - id: R1
    description: "L0 pure-core must have zero non-stdlib transitive dependencies"
    type: stdlib-only
    targets: [internal/domain, internal/accesslease, internal/localkey]

  # R2: exactauthority restricted deps (only accesslease, localkey, self)
  - id: R2
    description: "exactauthority may only depend on accesslease, localkey, and self"
    type: forbidden-target
    targets: [internal/exactauthority]
    forbid:
      - internal/domain
      - internal/node
      - internal/reachability
      - internal/reachability/bundle
      - internal/engine
      - internal/openauth
      - internal/usecase
      - internal/runtime
      - internal/store
      - internal/cli
      - internal/discovery
      - internal/authority
      - internal/protocol
    kind: transitive

  # R3: node must not depend on outer-adapter-composition
  - id: R3
    description: "host-integration adapter must not depend on outer-adapter-composition"
    type: forbidden-target
    targets: [internal/node]
    forbid:
      - internal/runtime
      - internal/authority
      - internal/discovery
      - internal/store
      - internal/cli
    kind: transitive

  # R4: reachability must not depend on outer-adapter-composition
  - id: R4
    description: "L1 reachability must not depend on runtime/authority/discovery/store/CLI"
    type: forbidden-target
    targets: [internal/reachability]
    forbid:
      - internal/runtime
      - internal/authority
      - internal/discovery
      - internal/store
      - internal/cli
    kind: transitive

  # R5: bundle must be maximally isolated
  - id: R5
    description: "bundle must not depend on node, runtime, authority, discovery, store, CLI, or reachability root"
    type: forbidden-target
    targets: [internal/reachability/bundle]
    forbid:
      - internal/node
      - internal/runtime
      - internal/authority
      - internal/discovery
      - internal/store
      - internal/cli
      - internal/reachability
    kind: transitive

  # R6: engine connectivity-only (no store/discovery/authority/CLI/exactauthority/localkey/accesslease/openauth/usecase)
  - id: R6
    description: "Pipe Engine must not depend on store/discovery/authority/CLI/exactauthority/localkey/accesslease/openauth/usecase"
    type: forbidden-target
    targets: [internal/engine]
    forbid:
      - internal/store
      - internal/discovery
      - internal/authority
      - internal/cli
      - internal/exactauthority
      - internal/localkey
      - internal/accesslease
      - internal/openauth
      - internal/usecase
    kind: transitive

  # R7: openauth must be stdlib-only
  - id: R7
    description: "openauth must be stdlib-only with no repo deps"
    type: stdlib-only
    targets: [internal/openauth]

  # R8: usecase must not depend on outer-adapter-composition, host-reachability, or engine
  - id: R8
    description: "L4 usecase must not depend on store/runtime/discovery/authority/CLI/node/engine/reachability/bundle"
    type: forbidden-target
    targets: [internal/usecase]
    forbid:
      - internal/store
      - internal/runtime
      - internal/discovery
      - internal/authority
      - internal/cli
      - internal/node
      - internal/engine
      - internal/reachability
      - internal/reachability/bundle
    kind: transitive

# File-level guards for mixed packages
file_guards:
  # R9: serve.go must not import concrete authority/store/discovery
  - rule: R9
    description: "receiving boundary must not import concrete authority/store/discovery"
    path: internal/runtime/serve.go
    forbidden_imports:
      - "github.com/origama/tubo-rebuilt/internal/authority"
      - "github.com/origama/tubo-rebuilt/internal/store"
      - "github.com/origama/tubo-rebuilt/internal/discovery"

  # R10: session.go must not import libp2p host/network/peer/protocol or store
  - rule: R10
    description: "Session file must not import concrete libp2p host/network/peer/protocol or store"
    path: internal/runtime/session.go
    forbidden_imports:
      - "github.com/libp2p/go-libp2p/core/host"
      - "github.com/libp2p/go-libp2p/core/network"
      - "github.com/libp2p/go-libp2p/core/peer"
      - "github.com/libp2p/go-libp2p/core/protocol"
      - "github.com/origama/tubo-rebuilt/internal/store"

  # R19: the L2 exact downstream open path must never import the L4 usecase
  # package. The neutral openauth.AccessAcquirer is injected from the
  # composition root instead (internal/runtime/exact_access.go).
  - rule: R19
    description: "L2 exact downstream open must not import L4 usecase"
    path: internal/runtime/exact_downstream.go
    forbidden_imports:
      - "github.com/origama/tubo-rebuilt/internal/usecase"

  # R20: the L2 local exact pipe runtime must not import the L4 usecase
  # package and must not construct or reference L4 exact access policy.
  - rule: R20
    description: "L2 local exact pipe runtime must not import L4 usecase"
    path: internal/runtime/pipe.go
    forbidden_imports:
      - "github.com/origama/tubo-rebuilt/internal/usecase"

# Semantic pattern checks (source-level scans)
semantic_checks:
  # R11: no global dispatch symbols in runtime
  - rule: R11
    description: "forbidden package-global Session dispatch symbols in internal/runtime"
    path_glob: internal/runtime/*.go
    forbid_patterns:
      - instanceRegistry
      - SetInstanceRegistry
      - HandleResumeStreamID

  # Openauth must not carry Scope or arbitrary metadata map
  - rule: R12
    description: "openauth contract must not carry Scope or map[string]any"
    path_glob: internal/openauth/*.go
    forbid_patterns:
      - 'Scope.*json:"scope'
      - 'map\[string\]any'

  # Accesslease/localkey/exactauthority must not carry Scope or arbitrary metadata map
  - rule: R13
    description: "pure L3 packages must not carry Scope or map[string]any"
    path_glob: internal/accesslease/*.go
    forbid_patterns:
      - 'Scope.*json:"scope'
      - 'map\[string\]any'
  - rule: R13b
    description: "localkey must not carry Scope or arbitrary metadata"
    path_glob: internal/localkey/*.go
    forbid_patterns:
      - 'Scope.*json:"scope'
      - 'map\[string\]any'
  - rule: R13c
    description: "exactauthority must not carry Scope or arbitrary metadata"
    path_glob: internal/exactauthority/*.go
    forbid_patterns:
      - 'Scope.*json:"scope'
      - 'map\[string\]any'

  # Usecase must not expose *store.Store
  - rule: R14
    description: "usecase must not expose *store.Store"
    path_glob: internal/usecase/*.go
    forbid_patterns:
      - store\.Store
      - \*store\.Store

  # Usecase must not define generic repository framework
  - rule: R15
    description: "usecase must define narrow consumer-owned ports only"
    path_glob: internal/usecase/*.go
    forbid_patterns:
      - Repository\[
      - UnitOfWork

  # Relay reservation policy must not live in the published-Pipe runtime.
  # Reservation timing/liveness decisions (when to renew, when connectedness is
  # insufficient) are an L1 Reachability responsibility, owned entirely by
  # internal/reachability.RelayReservation.
  - rule: R16
    description: "published-Pipe runtime must not contain relay reservation policy; timing/liveness decisions are L1 reachability"
    path_glob: internal/runtime/pipe.go
    forbid_patterns:
      - EnsureRelay
      - PeerConnected
      - ReserveRelay
      - lastRenewed

  # R17: L2 Pipe Engine must not reference accepted-binding / exact-renewal
  # policy. The durable accepted relationship, lease cache, renewal, and
  # authority/binding persistence are owned strictly outside L2; the engine
  # opens a remote Pipe only through the injected neutral opener.
  - rule: R17
    description: "L2 Pipe Engine must not reference accepted-binding or exact-renewal policy"
    path_glob: internal/engine/*.go
    forbid_patterns:
      - RemotePipeBinding
      - AcceptedBinding
      - ExactRenewal
      - RenewAcceptedAccess

  # R21: the L2 exact-open execution files must not reference L4 exact access
  # symbols (UseCases, acquire use case, accepted-binding value types). This
  # guards the boundary beyond plain imports so the violation cannot return
  # through renamed imports or expressions.
  - rule: R21
    description: "L2 exact-open files must not reference L4 accepted-binding/renewal policy"
    path_glob: internal/runtime/pipe.go
    forbid_patterns:
      - usecase.
      - UseCases
      - AcquireAcceptedPipeAccess
      - AcceptedPipeAccess
  - rule: R22
    description: "L2 exact downstream open must not reference L4 accepted-binding/renewal policy"
    path_glob: internal/runtime/exact_downstream.go
    forbid_patterns:
      - usecase.
      - UseCases
      - AcquireAcceptedPipeAccess
      - AcceptedPipeAccess
